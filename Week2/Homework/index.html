<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module" src="members_data.js"></script>
    <title>2주차 과제 - 관리자 페이지 만들기</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <!-- header -->
    <header class="header">
        <p class="header__left">❄</p>
        <h3 class="header__center">웹계인 관리 페이지</h3>
        <p class="header__right">🪽 DIVE SOPT WEB 37기 YB 손하은 🪽</p>
    </header>
    <main class="main">
        <!-- filter section -->
        <section class="filter">
            <h4>검색 필터</h4>
            <form id="filter-form" class="filter__form">
                <ul class="filter__group">
                    <li class="filter__item filter__item--name">
                        <label for="name">이름</label>
                        <input id="name" class="filter__input" type="text" placeholder="이름을 입력하세요" autocomplete="off">
                    </li>
                    <li class="filter__item filter__item--english-name">
                        <label for="english-name">영문 이름</label>
                        <input id="english-name" class="filter__input" type="text" placeholder="영문 이름을 입력하세요">
                    </li>
                    <li class="filter__item filter__item--github">
                        <label for="github">깃허브</label>
                        <input id="github" class="filter__input" type="text" placeholder="깃허브 아이디를 입력하세요">
                    </li>
                    <li class="filter__item filter__item--gender">
                        <label for="gender">성별</label>
                        <select id="gender" class="filter__select">
                            <option value="all">전체</option>
                            <option value="male">남자</option>
                            <option value="female">여자</option>
                        </select>
                    </li>
                    <li class="filter__item filter__item--role">
                        <label for="role">역할</label>
                        <select id="role" class="filter__select">
                            <option value="all">전체</option>
                            <option value="OB">OB</option>
                            <option value="YB">YB</option>
                        </select>
                    </li>
                    <li class="filter__item filter__item--team">
                        <label for="code-review-team">금잔디조</label>
                        <input id="code-review-team" class="filter__input" type="text" placeholder="금잔디조를 입력하세요 (1~9)">
                    </li>
                    <li class="filter__item filter__item--age">
                        <label for="age">나이</label>
                        <input id="age" class="filter__input" type="text" placeholder="나이를 입력하세요">
                    </li>
                </ul>
                <div class="filter__actions">
                    <button class="filter__button filter__button--apply" type="submit">적용</button>
                    <button class="filter__button filter__button--reset" type="reset">초기화</button>
                </div>
            </form>
        </section>
        <!-- table section -->
        <section class="part-list">
            <header class="part-list__header">
                <h4>37기 웹 파트 목록</h4>
                <div class="part-list__actions">
                    <button id="delete-btn" class="part-list__button" type="button">선택 삭제</button>
                    <button id="add-btn" class="part-list__button" type="button">추가</button>
                </div>
            </header>
            <table class="member-table">
                <thead>
                    <tr>
                        <th><input id="select-all" type="checkbox"></th>
                        <th>이름</th>
                        <th>영문 이름</th>
                        <th>깃허브</th>
                        <th>성별</th>
                        <th>역할</th>
                        <th>금잔디조</th>
                        <th>나이</th>
                    </tr>
                </thead>
                <tbody id="member-table-body"></tbody>
            </table>
        </section>
    </main>

    <!-- modal -->
    <dialog class="dialog" closedby="any">
        <header class="dialog__header">
            <h3>멤버 추가</h3>
            <img id="close-btn" src="./images/ic-delete.png" alt="모달창 닫기 버튼" />
        </header>

        <form id="modal-form" class="modal__form">
            <ul class="modal__group">
                <li class="modal__item modal__item--name">
                    <label for="modal-name">이름</label>
                    <input id="modal-name" class="modal__input" type="text" placeholder="이름을 입력하세요" autocomplete="off">
                </li>
                <li class="modal__item modal__item--english-name">
                    <label for="modal-english-name">영문 이름</label>
                    <input id="modal-english-name" class="modal__input" type="text" placeholder="영문 이름을 입력하세요">
                </li>
                <li class="modal__item modal__item--github">
                    <label for="modal-github">깃허브</label>
                    <input id="modal-github" class="modal__input" type="text" placeholder="깃허브 아이디를 입력하세요">
                </li>
                <li class="modal__item modal__item--gender">
                    <label for="modal-gender">성별</label>
                    <select id="modal-gender" class="modal__select">
                        <option value="">선택</option>
                        <option value="male">남자</option>
                        <option value="female">여자</option>
                    </select>
                </li>
                <li class="modal__item modal__item--role">
                    <label for="modal-role">역할</label>
                    <select id="modal-role" class="modal__select">
                        <option value="">선택</option>
                        <option value="OB">OB</option>
                        <option value="YB">YB</option>
                    </select>
                </li>
                <li class="modal__item modal__item--team">
                    <label for="modal-code-review-team">금잔디조</label>
                    <input id="modal-code-review-team" class="modal__input" type="text" placeholder="금잔디조를 입력하세요 (1~9)">
                </li>
                <li class="modal__item modal__item--age">
                    <label for="modal-age">나이</label>
                    <input id="modal-age" class="modal__input" type="text" placeholder="나이를 입력하세요">
                </li>
            </ul>
            <button class="modal__button--submit" type="submit">추가</button>
        </form>
    </dialog>

    <script type="module" src="index.js"></script>
</body>
</html>
